[project]
name = "opencodex-desktop"
version = "0.1.0"
description = "Use Qwen, local vLLM, or any OpenAI-compatible model in the Codex Desktop app and CLI next to your ChatGPT models, from one YAML file"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "anhvth" }]
keywords = ["codex", "codex-desktop", "openai", "qwen", "vllm", "proxy", "uvx"]
dependencies = [
    "aiohttp>=3.9",
    "pyyaml>=6",
    "tomlkit>=0.12",
]

[project.scripts]
opencodex-desktop = "opencodex_desktop.cli:main"

[project.urls]
Homepage = "https://github.com/anhvth/opencodex-desktop"
Repository = "https://github.com/anhvth/opencodex-desktop"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opencodex_desktop"]

[dependency-groups]
dev = ["pytest>=8"]
