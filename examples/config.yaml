# ocx config: the ONE file for everything.
# Location: ~/.config/ocx/config.yaml  (or pass --config / $OCX_CONFIG)
# With no file at all, `ocx start` serves just your ChatGPT models.

# Where Codex keeps config.toml + auth.json. $CODEX_HOME wins; otherwise the first
# existing entry below; otherwise ~/.codex.
codex_home: [~/.codex]

# Router address Codex will talk to.
listen: 127.0.0.1:11111

# Claude app SSH sessions (optional): the remote calls the gateway itself, so this opens a public,
# token-protected Cloudflare quick tunnel to the router (needs cloudflared). List jump hosts too.
# claude_app:
#   ssh_hosts: [my-gpu-box]

# Your ChatGPT/OpenAI models come from the Codex login (codex login / Codex app sign-in).
openai:
  enabled: true
  # exclude_regex: '-legacy$'          # optional regex matched against bare GPT slugs
  # context_window: {gpt-5.5: 256000}    # optional per-model cap

# Optional cap on every model's context window (GPT and custom).
# max_context_window: 300000

# Model selected in Codex after start (optional). Format: <provider>/<model> or a GPT slug.
# default_model: alibaba/qwen4-max

# Claude models (anthropic/claude-*). Enabled automatically when $ANTHROPIC_API_KEY is set;
# uncomment to configure explicitly. Needs an Anthropic API key (not a Claude subscription).
# anthropic:
#   enabled: true
#   api_key_env: ANTHROPIC_API_KEY          # or api_key_file: ~/.config/anthropic/api_key, or api_key: sk-ant-...
#   base_url: https://api.anthropic.com/v1  # any Anthropic-compatible gateway works too
#   models: auto                           # everything /v1/models returns unless excluded
#   # exclude_regex: '-legacy$'            # optional regex matched against upstream model IDs

# Any OpenAI-compatible endpoint. Models that are unreachable or not served are dropped.
# Context window: value here, else what the provider's /models reports, else 128k (with a warning).
providers:
  alibaba:
    base_url: https://token-plan.maas.qwencloudapi.com/compatible-mode/v1
    api_key_file: ~/.config/claude-alibaba/token   # or api_key_env: DASHSCOPE_API_KEY, or api_key: sk-...
    # wire_api: responses                          # auto-detected (responses vs chat) if omitted
    # Anthropic Messages endpoint: makes these models usable from Claude Code and the Claude app too.
    anthropic_url: https://token-plan.maas.qwencloudapi.com/apps/anthropic/v1
    models: auto
    exclude_regex: '(?i)(embedding|rerank|tts|asr)'

  local-vllm:
    enabled: false              # flip to true on a machine that runs vLLM
    base_url: http://127.0.0.1:7788/v1
    models: auto                # every served model; vLLM reports max_model_len itself
    # Claude clients use vLLM's own /v1/messages (anthropic_url defaults to base_url for local hosts).
